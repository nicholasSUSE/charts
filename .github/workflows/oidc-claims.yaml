name: OIDC claims

# Experiment: shows which claims the OIDC token has in a plain job, in a job
# that calls a reusable workflow, and in a composite action. Reads no secret.
on:
  push:
    branches: [experiment/oidc-claims]

permissions: {}

jobs:
  plain:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - name: Get the script
        run: git clone --depth 1 --branch "$GITHUB_REF_NAME" "https://github.com/$GITHUB_REPOSITORY" src
      - name: Claims
        env:
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO_NAME: ${{ github.event.repository.name }}
          GH_REPOSITORY: ${{ github.repository }}
        run: src/.github/scripts/claims.sh "plain job"

  reusable:
    permissions:
      id-token: write
    uses: ./.github/workflows/oidc-claims-reusable.yaml

  composite:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - name: Get the repository
        run: git clone --depth 1 --branch "$GITHUB_REF_NAME" "https://github.com/$GITHUB_REPOSITORY" src
      - uses: ./src/.github/actions/oidc-claims
