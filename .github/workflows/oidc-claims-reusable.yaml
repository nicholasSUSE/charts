name: OIDC claims (reusable)

on:
  workflow_call:

permissions: {}

jobs:
  claims:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - name: Get the script
        run: git clone --depth 1 --branch "$GITHUB_REF_NAME" "https://github.com/$GITHUB_REPOSITORY" src
      - name: Claims
        env:
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO_NAME: ${{ github.event.repository.name }}
          GH_REPOSITORY: ${{ github.repository }}
        run: src/.github/scripts/claims.sh "reusable workflow"
